name = "cifras-capela"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# O Worker serve os assets estáticos do build do frontend (SPA) e adiciona
# rotas próprias (sitemap.xml, headers). Quando quiser uma API, basta
# adicionar rotas em src/index.ts sob /api/*.
[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

# Importa os prompts .md como string (ver src/prompts/*.md).
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Banco D1 (SQLite). Guarda músicas, administradores e playlists — é o que
# substituiu o Supabase. Criado com `wrangler d1 create cifras-db`.
[[d1_databases]]
binding = "DB"
database_name = "cifras-db"
database_id = "5b8c9b40-7994-450f-85b1-3f7be7228130"
migrations_dir = "migrations"

# Segredos (defina com `wrangler secret put NOME`):
#   JWT_SECRET  → assina o cookie de sessão de quem edita
[vars]
APP_ENV = "production"

[observability]
enabled = true
